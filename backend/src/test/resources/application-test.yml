spring:
  main:
    banner-mode: "off"

  test:
    database:
      replace: none

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      uuid_gen_func: "random_uuid()"
      booking_unique_index_def: "ON booking(turf_id, booking_date, start_time, end_time, status)"

logging:
  level:
    root: WARN
    com.turfai.booking: INFO
