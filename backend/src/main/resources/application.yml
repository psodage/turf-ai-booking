# ============================================================
# Turf AI Booking — Base Application Configuration
# ============================================================
# Profile-specific files override these values:
#   application-dev.yml      local development
#   application-staging.yml  pre-production
#   application-prod.yml     production
# ============================================================

spring:
  application:
    name: turf-ai-booking

  # ---- Database ----
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/turfai}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:turfai}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:turfai}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: turfai-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---- JPA ----
  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must not modify it
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    placeholders:
      uuid_gen_func: "gen_random_uuid()"
      booking_unique_index_def: "ON booking(turf_id, booking_date, start_time, end_time) WHERE status IN ('HOLD', 'PAYMENT_PENDING', 'CONFIRMED')"

  # ---- Jackson ----
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ---- Lifecycle ----
  lifecycle:
    timeout-per-shutdown-phase: 20s

# ---- Server ----
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  servlet:
    context-path: /
  error:
    # All errors handled by GlobalExceptionHandler — disable default error page
    whitelabel:
      enabled: false

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: Turf AI Booking
    version: 0.1.0
    description: AI-powered WhatsApp booking system

# ---- WhatsApp Business API ----
whatsapp:
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:PHONE_NUM_ID_DEMO_001}
  business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:BIZ_ACCT_ID_DEMO_001}
  access-token: ${WHATSAPP_ACCESS_TOKEN:demo_access_token}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:turfai_verify_token}
  app-secret: ${WHATSAPP_APP_SECRET:turfai_app_secret_dev}

# ---- AI Engine Configuration ----
ai:
  provider: ${AI_PROVIDER:mock}
  api-key: ${AI_API_KEY:demo_ai_api_key}
  model: ${AI_MODEL:gpt-4o-mini}
  api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
  max-tokens: 2000
  max-context-messages: 10
  session-timeout-minutes: 30
  max-turns-per-session: 20

# ---- Razorpay Payment Gateway ----
razorpay:
  mode: ${RAZORPAY_MODE:mock}
  key-id: ${RAZORPAY_KEY_ID:rzp_test_demo_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_demo_key_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:turfai_rzp_webhook_secret_dev}

# ---- Logging ----
logging:
  level:
    root: WARN
    com.turfai.booking: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
