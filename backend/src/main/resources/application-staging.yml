# ============================================================
# Staging Profile Configuration
# ============================================================

spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

logging:
  level:
    root: INFO
    com.turfai.booking: INFO
