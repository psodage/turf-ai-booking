# ==============================================================================
# Turf AI Booking — Development Spring Environment Profile (dev)
# ==============================================================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turfai_db}
    username: ${SPRING_DATASOURCE_USERNAME:turfai_app}
    password: ${SPRING_DATASOURCE_PASSWORD:turfai_secret_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
