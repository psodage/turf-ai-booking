# ============================================================
# Production Profile Configuration
# ============================================================

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.turfai.booking: INFO
