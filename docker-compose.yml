version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: turfai-postgres
    environment:
      POSTGRES_DB: turfai_dev
      POSTGRES_USER: turfai
      POSTGRES_PASSWORD: turfai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turfai -d turfai_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
